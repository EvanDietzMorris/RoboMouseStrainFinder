[project]
name = "robomouse-strain-finder"
version = "0.1.0"
description = "Find MMRRC mouse strains for a phenotype or disease via RoboMouse KG"
readme = "README.md"
authors = [
    { name = "Evan Morris", email = "evandietzmorris@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
robomouse-strain-finder = "robomouse_strain_finder:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
