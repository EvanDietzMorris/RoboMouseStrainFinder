<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboMouse Strain Finder</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🐁</text></svg>">
</head>
<body>
<main>
  <header>
    <h1>RoboMouse Strain Finder</h1>
    <a class="home-link" href="/">What is this?</a>
  </header>
  <p class="tagline">
    Phenotype or disease &rarr; genes &amp; orthologs &rarr; pathways &rarr; MMRRC mouse strains.
  </p>

  <form class="search" id="search-form" autocomplete="off">
    <div class="search-row">
      <div class="field grow combo">
        <label for="term">Phenotype or disease</label>
        <input type="text" id="term" name="term" placeholder="e.g. epilepsy, obesity, Rett syndrome"
               role="combobox" aria-expanded="false" aria-controls="suggestions"
               aria-autocomplete="list" required>
        <ul class="suggestions" id="suggestions" role="listbox" aria-label="Matching terms" hidden></ul>
      </div>

      <div class="field">
        <span class="label" id="species-label">Vocabulary</span>
        <div class="segmented" role="radiogroup" aria-labelledby="species-label">
          <label><input type="radio" name="species" value="human" checked><span>Human</span></label>
          <label><input type="radio" name="species" value="mouse"><span>Mouse</span></label>
        </div>
      </div>

      <button type="submit" id="submit">Search</button>
    </div>

    <div id="pinned-wrap"></div>

    <details class="advanced">
      <summary>Advanced</summary>
      <div class="advanced-grid">
        <div class="field">
          <label for="max_genes">Max genes</label>
          <input type="number" id="max_genes" value="100" min="1" max="500">
        </div>
        <div class="field">
          <label for="max_strains">Max strains</label>
          <input type="number" id="max_strains" value="200" min="1" max="2000">
        </div>
        <div class="field">
          <label for="max_pathways">Max pathways</label>
          <input type="number" id="max_pathways" value="40" min="0" max="200">
        </div>
        <label class="check"><input type="checkbox" id="include_orthologs" checked> Include orthologs</label>
        <label class="check"><input type="checkbox" id="bridge_species" checked> UPheno species bridge</label>
        <label class="check"><input type="checkbox" id="exclude_enu"> Hide ENU (CI) lines</label>
        <label class="check"><input type="checkbox" id="exclude_tools"> Hide reporter / cre lines</label>
      </div>
    </details>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div id="results"></div>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
